name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # CPU test data is downloaded on first use; a cache miss means the tests download it again.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/6502-tests
          key: cpu-test-data-${{ hashFiles('src/test/java/testdata/TestData.java') }}
      # xvfb (preinstalled on ubuntu-latest) gives the Front panel smoke test a display
      - run: xvfb-run -a mvn -B verify -Psinglestep
